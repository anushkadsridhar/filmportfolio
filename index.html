<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anushka Sridhar Films</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caladea:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<style>
:root{--bg:#ebe4da;--paper:#f6f1e9;--ink:#1d1915;--gray:#72685d;--line:rgba(45,32,20,.18);--rose:#b3283a;--serif:Cambria,"Caladea",Georgia,serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:17px;display:grid;place-items:center;padding:24px 16px;
  background-image:radial-gradient(70% 55% at 0% 0%,rgba(236,168,98,.22),transparent 70%),radial-gradient(60% 50% at 100% 100%,rgba(179,40,58,.08),transparent 70%),radial-gradient(rgba(70,50,30,.14) 1px,transparent 1.4px);
  background-size:auto,auto,24px 24px}
.card{width:min(400px,100%);background:var(--paper);box-shadow:0 18px 40px rgba(45,32,20,.14),0 1px 0 rgba(45,32,20,.06);transform:rotate(-.6deg)}
.stripe{height:26px;background:repeating-linear-gradient(-45deg,var(--ink) 0 18px,var(--paper) 18px 36px);border-bottom:3px solid var(--ink)}
.body{padding:26px 28px 28px;display:grid;gap:14px}
h1{margin:0;font-weight:400;font-size:clamp(34px,8vw,44px);line-height:.95}
h1 i{display:block}
h1 b{display:block;padding-left:28px}
p{margin:0;color:var(--gray);font-style:italic}
form{display:grid;gap:10px;margin-top:4px}
label{font-size:15px;color:var(--gray)}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;padding:10px 12px;border:1px solid var(--line);background:#fffdf9;color:var(--ink);border-radius:2px}
input:focus{outline:2px solid var(--ink);outline-offset:1px}
button{font:inherit;padding:10px 16px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;border-radius:2px}
button:hover{background:#3a322c}
button:disabled{opacity:.6;cursor:default}
.err{min-height:1.3em;font-size:15px;color:var(--rose)}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
</style>
</head>
<body>
<main class="card">
  <div class="stripe" aria-hidden="true"></div>
  <div class="body">
    <h1><i>Anushka</i><b>Sridhar</b></h1>
    <p>Enter the password to view the portfolio.</p>
    <form id="f" autocomplete="off">
      <label for="pw">Password</label>
      <div class="row"><input id="pw" type="password" autofocus required><button id="go" type="submit">Enter</button></div>
      <div class="err" id="err" role="alert"></div>
    </form>
  </div>
</main>
